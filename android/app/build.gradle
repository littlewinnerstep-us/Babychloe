plugins {
    id 'com.android.application'
}

android {
    namespace 'com.evergreenpaws.memorial'
    compileSdk 34

    defaultConfig {
        applicationId "com.evergreenpaws.memorial"
        minSdk 21
        targetSdk 34
        versionCode 9
        versionName "2.0"
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
